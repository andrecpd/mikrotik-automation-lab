# Estado desejado da LAN do laboratório. Ajuste antes de aplicar.
lan:
  bridge: bridge-LAN
  interface_ports:
    - ether2
    - ether3
    - ether4
    - ether5
  gateway_cidr: 192.168.10.1/24
  network: 192.168.10.0/24
  dhcp:
    enabled: true
    server_name: dhcp-lan
    pool_name: pool-lan
    pool_range: 192.168.10.100-192.168.10.200
    lease_time: 1d
    dns_servers:
      - 192.168.10.1
