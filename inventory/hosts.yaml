all:
  children:
    mikrotik_filiais:
      hosts:
        filial_01:
          ansible_host: 192.168.3.11
          local_as: 65011
          lan_subnet: 192.168.10.0/24
        filial_02:
          ansible_host: 192.168.3.12
          local_as: 65012
          lan_subnet: 192.168.20.0/24
        filial_03:
          ansible_host: 192.168.3.13
          local_as: 65013
          lan_subnet: 192.168.30.0/24
        filial_04:
          ansible_host: 192.168.3.14
          local_as: 65014
          lan_subnet: 192.168.40.0/24
  vars:
    # Defina MIKROTIK_USER e MIKROTIK_PASSWORD no shell; nunca versionar credenciais.
    ansible_user: "{{ lookup('env', 'MIKROTIK_USER') }}"
    ansible_password: "{{ lookup('env', 'MIKROTIK_PASSWORD') }}"
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: community.routeros.routeros
    ansible_command_timeout: 30
